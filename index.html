<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Replace the URL with your preferred background image link */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9V2qkfapdTUP09RnQ7xmpPlk9RaG96SgkvKI5yy9y2MDc3AJPP_QeSaw&s=10) no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff5100;
            letter-spacing: 2px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 25px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color:#ff5100;
        }

        .main-content {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: auto;
        }

        .main-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .main-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #cccccc;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ff5100;
            color: #111111;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            
        }

        .btn:hover {
            background-color:#ff5100;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 0.9rem;
            color: #888888;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 15px;
            }
            nav {
                margin-top: 15px;
            }
            nav a {
                margin: 0 10px;
            }
            .main-content h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">WORLD GAMES</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="Platforms.html">Platforms</a>
            <a href="Games.html">Games</a>
            <a href="Contact.html">Contact</a>
        </nav>
    </header>

    <div class="main-content">
        <h1>Explore the Ultimate Gaming Universe</h1>
        <p>Find the thrilling and exciting games, discover new releases, and have the cheapest prices all around the globe on a single platform.</p>
        <a href="#" class="btn">Buy Now</a>
    </div>

    <footer>
        <p>&copy; 2026 World Games. All rights reserved.</p>
    </footer>

</body>
</html>
